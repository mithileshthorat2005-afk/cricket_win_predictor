# Test profile: in-memory H2 (MySQL mode), FastAPI pointed at a dead port.
# Integration tests mock FastApiClient or run against MockWebServer, so no
# real ML service is needed.
spring.datasource.url=jdbc:h2:mem:cricket;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# FastAPI base-url points at a guaranteed-dead port; the client is mocked
# in tests that need it (unit tests use MockWebServer directly).
cricket.fastapi.base-url=http://localhost:9
cricket.fastapi.connect-timeout-ms=200
cricket.fastapi.response-timeout-ms=500
cricket.fastapi.health-timeout-ms=15000
cricket.prediction.auto-on-ball=false
cricket.prediction.mc-simulations=50
cricket.commentary.enabled=false
# No Redis in the shared test profile; dedicated cache tests mock the
# Redis template. The cache also degrades gracefully when Redis is down.
cricket.cache.enabled=false

logging.level.com.example.cricket=INFO
