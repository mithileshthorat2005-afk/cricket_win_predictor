# ============================================================
# Cricket Win Probability Orchestrator - Spring Boot backend
# All environment-specific values are overridable via env vars.
# ============================================================

spring.application.name=live-cricket
server.port=${SERVER_PORT:8080}

# ---------------- FastAPI ML microservice --------------------
cricket.fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}
cricket.fastapi.connect-timeout-ms=${FASTAPI_CONNECT_TIMEOUT_MS:2000}
cricket.fastapi.response-timeout-ms=${FASTAPI_RESPONSE_TIMEOUT_MS:60000}
cricket.fastapi.health-timeout-ms=${FASTAPI_HEALTH_TIMEOUT_MS:2000}

# ---------------- Prediction behaviour -----------------------
# 'xgboost' (fast, default) or 'montecarlo' (slower, richer)
cricket.prediction.default-model=${PREDICTION_DEFAULT_MODEL:xgboost}
# Monte Carlo simulation count for the montecarlo path
cricket.prediction.mc-simulations=${PREDICTION_MC_SIMULATIONS:300}
# Automatically request a prediction after each accepted ball event
cricket.prediction.auto-on-ball=${PREDICTION_AUTO_ON_BALL:true}

# ---------------- AI commentary (OPTIONAL) -------------------
# Requires a local Ollama server; when disabled or unreachable
# the API still works and commentary is simply omitted.
cricket.commentary.enabled=${COMMENTARY_ENABLED:false}
cricket.commentary.timeout-ms=${COMMENTARY_TIMEOUT_MS:5000}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3}

# ---------------- Redis cache ----------------------------------
cricket.cache.enabled=${CACHE_ENABLED:true}
cricket.cache.state-ttl-seconds=${CACHE_STATE_TTL:300}
cricket.cache.prediction-ttl-seconds=${CACHE_PREDICTION_TTL:600}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# ---------------- MySQL (Spring Data JPA) --------------------
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/cricket?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${MYSQL_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# ---------------- Actuator ------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ---------------- Logging -------------------------------------
logging.level.com.example.cricket=INFO
